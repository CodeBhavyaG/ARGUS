[project]
name = "sih-hackathon"
version = "0.1.0"
description = "Structured Research Brief Agent prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "groq>=0.30.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
